      /* ========================================================
         CINEBOX COMPACT CORNER SERVER DROPDOWN SYSTEM
         ======================================================== */
      .server-switcher-box {
        width: 100%;
        max-width: 460px;
        margin: 0 0 16px 0;
        padding: 12px 14px 12px;

      .server-strip-heading {

        width: 5px;
        height: 5px;

      /* Dropdown Container & Trigger */
      .server-dropdown-container {
        position: relative;
        width: 100%;
        z-index: 55;
      }
      .server-dropdown-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 12px;
        background: rgba(20, 20, 24, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 10px;
        color: #ffffff;
        cursor: pointer;
        transition: all 0.16s ease;
        text-align: left;
        user-select: none;
        outline: none;
        box-sizing: border-box;
      }
      .server-dropdown-trigger:hover {
        background: rgba(26, 26, 32, 0.98);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .server-dropdown-trigger.is-open {
        border-color: rgba(255, 255, 255, 0.25) !important;

      .server-dropdown-trigger-left {

        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .server-dot {

        height: 6px;
        border-radius: 50%;

        flex-shrink: 0;
      }
      .server-dot.active {
        background: #e4e4e7;
      }
      .server-num {
        font-size: 13px;
        font-weight: 500;
        color: #a1a1aa;
      }
      .server-name {
        font-size: 13.5px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.01em;
      }
      .server-badge {
        font-size: 9.5px;
        font-weight: 700;
        color: #a1a1aa;
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        line-height: 1.2;
        text-transform: uppercase;
      }
      .server-active-pill {
        font-size: 9px;
        font-weight: 800;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.14);
        padding: 2px 7px;
        border-radius: 9999px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.2;
      }
      .server-dropdown-trigger-right {
        display: inline-flex;
        align-items: center;
        color: #a1a1aa;
        flex-shrink: 0;
      }
      .server-dropdown-arrow {
        color: #a1a1aa;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .server-dropdown-arrow.rotated {
        transform: rotate(180deg);
      }

      /* Dropdown Menu */
      .server-dropdown-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        right: 0;
        z-index: 100;
        background: #0e0e12;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 5px;
        max-height: 300px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: dropdownSlideIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes dropdownSlideIn {
        from {
          opacity: 0;
          transform: translateY(-5px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .server-dropdown-menu::-webkit-scrollbar {
        width: 5px;
      }
      .server-dropdown-menu::-webkit-scrollbar-track {
        background: transparent;
      }
      .server-dropdown-menu::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
      }
      .server-dropdown-menu::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .server-dropdown-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 10px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid transparent;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.14s ease;
        text-align: left;
        user-select: none;
        outline: none;
        box-sizing: border-box;
      }
      .server-dropdown-item:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #ffffff;
      }
      .server-dropdown-item.selected {
        background: rgba(255, 255, 255, 0.09) !important;
        color: #ffffff !important;
      }
      .server-item-left {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .server-item-right {

        align-items: center;
        gap: 6px;
        flex-shrink: 0;

      .server-online-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #71717a;
      }
      .server-dropdown-item.selected .server-online-dot {
        background: #a1a1aa;
      }
      .server-online-text {
        font-size: 9.5px;
        font-weight: 700;
        color: #71717a;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .server-dropdown-item.selected .server-online-text {
        color: #a1a1aa;
      }

      /* Single-line sleek horizontal scroll row */
      .server-grid {
        display: flex !important;
        flex-wrap: nowrap !important;
        align-items: center;
        gap: 10px;
        overflow-x: auto !important;
        overflow-y: hidden;
        padding: 4px 2px 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(239, 68, 68, 0.4) rgba(255, 255, 255, 0.04);
        -webkit-overflow-scrolling: touch;
      }
      .server-grid::-webkit-scrollbar {
        height: 4px;
      }
      .server-grid::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
      }
      .server-grid::-webkit-scrollbar-thumb {
        background: rgba(239, 68, 68, 0.45);
        border-radius: 999px;
      }
      .server-grid::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }

      .server-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 15px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        white-space: nowrap;
        flex: 0 0 auto;
        user-select: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .server-chip:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.28);
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      }
      .server-chip.active {
        background: linear-gradient(135deg, rgba(229, 9, 20, 0.95), rgba(185, 28, 28, 0.95)) !important;
        border-color: #ff4d4d !important;
        color: #ffffff !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 18px rgba(229, 9, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
      }
      .server-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #64748b;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
      .server-chip:hover .server-dot {
        background: #94a3b8;
      }
      .server-chip.active .server-dot {
        background: #00e676 !important;
        box-shadow: 0 0 8px #00e676, 0 0 16px rgba(0, 230, 118, 0.6) !important;
        animation: pulseDot 2s infinite ease-in-out;
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.85; }
      }
      .server-num {
        font-size: 11px;
        font-weight: 800;
        opacity: 0.85;
        color: #f87171;
        font-variant-numeric: tabular-nums;
      }
      .server-chip.active .server-num {
        color: #ffffff;
        opacity: 0.95;
      }
      .server-name {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .server-badge {
        font-size: 9.5px;
        font-weight: 800;
        padding: 1.5px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #cbd5e1;
        letter-spacing: 0.05em;
      }
      .server-chip.active .server-badge {
        background: rgba(0, 0, 0, 0.25);
        border-color: rgba(255, 255, 255, 0.3);
        color: #ffffff;
      }

      /* MultiMovies 2.0 Playing Episode Info */
      .playing-episode-info { max-width: 1200px; margin: 18px auto 14px; padding: 0 24px; }
      .episode-kicker {
        display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; color: #ef4444; margin-bottom: 4px;

        font-size: 14px; color: #a1a1aa; line-height: 1.65; max-width: 80ch; margin: 0;
      }

      /* MultiMovies 2.0 TV Episode Navigator Bar */
      .ep-navigator-bar {
        max-width: 1200px; margin: 18px auto; padding: 12px 20px;
        background: rgba(18, 20, 29, 0.85); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px;

        display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;

      .ep-nav-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
        background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        text-decoration: none; transition: all 0.2s ease;

      .ep-nav-btn:hover { background: #dc2626; border-color: #dc2626; color: #fff; }
      .ep-nav-label { text-transform: uppercase; font-size: 11px; }
      .ep-nav-code { font-weight: 700; opacity: 0.8; }

      /* MultiMovies 2.0 / CineJoy Authentic Episodes Section */
      .cinejoy-episodes-section { max-width: 1100px; margin: 36px auto 0; padding: 0 24px; }
      .cinejoy-episodes-header {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px;
      }
      .cinejoy-episodes-title { font-size: 24px; font-weight: 800; color: #fff; margin: 0; }
      .cinejoy-episodes-controls { display: flex; align-items: center; gap: 10px; }
      .cinejoy-season-select {
        border: 1px solid #3f3f46; border-radius: 6px; color: #fafafa; background: #18181b;
        padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
      }
      .cinejoy-season-pill {
        background: rgba(220, 38, 38, 0.15); color: #ef4444; border: 1px solid rgba(220, 38, 38, 0.3);
        padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      }
      .episode-results-summary { color: #71717a; font-size: 12px; margin-bottom: 16px; }
      .cinejoy-season-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
      }
      .cinejoy-ep-card {
        background: #12141d; border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px; overflow: hidden; cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        display: flex; flex-direction: column; text-align: left;

      .cinejoy-ep-card:hover {

      .cinejoy-ep-card.active, .cinejoy-ep-card.is-playing {
        border-color: #dc2626 !important;
        box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.4), 0 8px 24px rgba(220, 38, 38, 0.25);

      .cinejoy-ep-thumb-box { position: relative; aspect-ratio: 16 / 9; background: #18181b; overflow: hidden; }
      .cinejoy-ep-img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cinejoy-ep-badge-num {
        position: absolute; top: 8px; left: 8px; background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(4px); color: #fff; font-size: 11px; font-weight: 800;

      .cinejoy-ep-badge-time {
        position: absolute; bottom: 8px; right: 8px; background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(4px); color: #d4d4d8; font-size: 10px; font-weight: 600;
        padding: 2px 6px; border-radius: 4px;

      .cinejoy-ep-play-overlay {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4);

      .cinejoy-ep-card:hover .cinejoy-ep-play-overlay,
      .cinejoy-ep-card.active .cinejoy-ep-play-overlay { opacity: 1; }
      .cinejoy-ep-play-circle {
        width: 38px; height: 38px; border-radius: 50%; background: #dc2626;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6); transform: scale(0.9);
        transition: transform 0.2s ease;

      .cinejoy-ep-card:hover .cinejoy-ep-play-circle { transform: scale(1); }
      .cinejoy-ep-body { padding: 12px; flex: 1 1 auto; display: flex; flex-direction: column; }
      .cinejoy-ep-name { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 6px; }
      .cinejoy-ep-card.active .cinejoy-ep-name { color: #ef4444; }
      .cinejoy-ep-desc {
        font-size: 12px; color: #71717a; line-height: 1.5; margin: 0;
        overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      }
      @media (max-width: 639px) {
        .server-switcher-box, .ep-navigator-bar { margin-left: 14px; margin-right: 14px; padding: 12px 14px; }
        .cinejoy-season-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .cinejoy-ep-body { padding: 8px 10px; }
        .cinejoy-ep-name { font-size: 12px; }
        .cinejoy-ep-desc { display: none; }
        .ep-nav-side { min-width: auto; }
